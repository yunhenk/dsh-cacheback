name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p dist
          npm pack --pack-destination dist
          mv dist/dsh-cacheback-*.tgz dist/dsh-cacheback.tgz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-cacheback.tgz
          generate_release_notes: true
