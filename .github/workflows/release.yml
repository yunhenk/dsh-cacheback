name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm pack --pack-destination dist
      - run: |
          file=$(ls dist/dsh-cacheback-*.tgz)
          cp "$file" dist/dsh-cacheback.tgz
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-cacheback.tgz
          generate_release_notes: true
